<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景元素 - 浅蓝色 -->
    <rect width="400" height="300" fill="#edf4ff" />
    
    <!-- 底部蓝色曲线 -->
    <path d="M 50 190 L 370 190 L 370 250 L 50 250 Z" fill="#dbeafe" />
    <path d="M 50 190 C 100 170 150 185 200 175 C 250 165 300 175 370 190" fill="#dbeafe" />
    
    <!-- 左侧日历/小卡片 -->
    <g class="floating-fast">
        <rect x="80" y="90" width="50" height="40" rx="3" fill="white" stroke="#a0c0ff" stroke-width="1" />
        <rect x="85" y="95" width="40" height="8" rx="1" fill="#a0c0ff" />
        <line x1="90" y1="110" x2="120" y2="110" stroke="#a0c0ff" stroke-width="1" stroke-dasharray="2" />
        <line x1="90" y1="120" x2="120" y2="120" stroke="#a0c0ff" stroke-width="1" stroke-dasharray="2" />
        
        <!-- 日历上的小方块 -->
        <rect x="90" y="95" width="5" height="5" rx="1" fill="#3366ff" />
        <rect x="100" y="95" width="5" height="5" rx="1" fill="#3366ff" />
    </g>
    
    <!-- 中央问卷 -->
    <g class="floating-slow">
        <rect x="160" y="70" width="100" height="150" rx="10" fill="#3366ff" />
        <rect x="160" y="100" width="100" height="120" rx="3" fill="white" />
        
        <!-- 问卷头部 -->
        <rect x="170" y="80" width="20" height="10" rx="2" fill="white" />
        
        <!-- 问卷选项 -->
        <rect x="170" y="120" width="10" height="10" rx="1" fill="#3366ff" />
        <rect x="190" y="120" width="60" height="10" rx="2" fill="#a0c0ff" />
        
        <rect x="170" y="140" width="10" height="10" rx="1" fill="#3366ff" />
        <rect x="190" y="140" width="60" height="10" rx="2" fill="#a0c0ff" />
        
        <rect x="170" y="160" width="10" height="10" rx="1" fill="#3366ff" />
        <rect x="190" y="160" width="60" height="10" rx="2" fill="#a0c0ff" />
        
        <rect x="170" y="180" width="60" height="10" rx="2" fill="#a0c0ff" />
        
        <!-- 提交按钮 -->
        <rect x="190" y="200" width="40" height="15" rx="3" fill="#3366ff" />
    </g>
    
    <!-- 右侧数据报表 -->
    <g class="floating">
        <rect x="280" y="90" width="80" height="100" rx="5" fill="white" stroke="#a0c0ff" stroke-width="1" />
        
        <!-- 图表元素 -->
        <rect x="290" y="100" width="25" height="25" rx="2" fill="#a0c0ff" />
        <rect x="325" y="100" width="25" height="25" rx="2" fill="#a0c0ff" />
        <rect x="290" y="135" width="60" height="8" rx="1" fill="#a0c0ff" />
        <rect x="290" y="150" width="60" height="8" rx="1" fill="#a0c0ff" />
        <rect x="290" y="165" width="60" height="8" rx="1" fill="#a0c0ff" />
    </g>
    
    <!-- 右下角表格文档 -->
    <g class="floating-slow">
        <rect x="320" y="165" width="60" height="45" rx="5" fill="white" stroke="#a0c0ff" stroke-width="1" />
        <rect x="325" y="170" width="50" height="5" rx="1" fill="#a0c0ff" />
        <rect x="325" y="180" width="50" height="5" rx="1" fill="#a0c0ff" />
        <!-- 表格线条 -->
        <line x1="330" y1="195" x2="370" y2="195" stroke="#a0c0ff" stroke-width="1" />
        <line x1="330" y1="200" x2="370" y2="200" stroke="#a0c0ff" stroke-width="1" />
        <line x1="340" y1="190" x2="340" y2="205" stroke="#a0c0ff" stroke-width="1" />
        <line x1="350" y1="190" x2="350" y2="205" stroke="#a0c0ff" stroke-width="1" />
        <line x1="360" y1="190" x2="360" y2="205" stroke="#a0c0ff" stroke-width="1" />
    </g>
    
    <!-- 蓝色手势 -->
    <g class="floating">
        <!-- 手臂部分 -->
        <path d="M 130 150 C 135 155 145 170 155 165 C 165 160 165 150 170 155" fill="#3366ff" stroke="#3366ff" stroke-width="1" />
        
        <!-- 手掌部分 -->
        <path d="M 170 155 C 180 160 190 165 195 155 C 200 145 190 140 185 145 C 180 150 175 155 170 155" fill="#3366ff" />
        
        <!-- 拇指 -->
        <path d="M 170 155 C 165 145 170 135 175 140" fill="#3366ff" />
        
        <!-- 小蓝色点缀 -->
        <circle cx="177" cy="150" r="5" fill="#60a5fa" />
    </g>
    
    <!-- 额外的蓝色装饰元素 -->
    <circle cx="100" cy="220" r="15" fill="#60a5fa" opacity="0.5" class="floating-slow" />
    <circle cx="350" cy="80" r="10" fill="#60a5fa" opacity="0.3" class="floating-fast" />
    <path d="M 250 230 C 260 220 280 240 290 230" stroke="#3366ff" stroke-width="1" fill="none" />
    
    <!-- 添加CSS动画 -->
    <style>
        .floating {
            animation: float 3s ease-in-out infinite;
        }
        
        .floating-slow {
            animation: float 5s ease-in-out infinite;
        }
        
        .floating-fast {
            animation: float 2s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</svg>
